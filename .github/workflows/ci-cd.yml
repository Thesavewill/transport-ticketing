name: Transport Ticketing CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run API Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ticket_service/requirements.txt

      - name: Run Pytest
        run: |
          cd ticket_service
          pytest test_api.py -v

  build-and-deploy:
    name: Build Images & Simulate Deploy (CD)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ticket Service Image
        run: |
          docker build -t transport-ticketing/ticket-service:latest ./ticket_service

      - name: Build Schedule Service Image
        run: |
          docker build -t transport-ticketing/schedule-service:latest ./schedule_service

      - name: Deploy to Docker Swarm (Simulation)
        run: |
          echo "В реальном проекте здесь выполняется подключение по SSH к серверу"
          echo "и команда: docker stack deploy -c docker-stack.yaml transport"
          echo "Деплой успешно завершен!"