services:
  api-gateway:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ticket-service:
    image: ticket-service:latest
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=tickets_db
      - DB_USER=postgres
      - DB_PASS=postgres
      - REDIS_HOST=redis-cache
      - RABBIT_HOST=rabbitmq
    networks:
      - frontend-net
      - backend-net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  schedule-service:
    image: schedule-service:latest
    environment:
      - REDIS_HOST=redis-cache
    networks:
      - frontend-net
      - backend-net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=tickets_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis-cache:
    image: redis:7-alpine
    networks:
      - backend-net
    deploy:
      replicas: 1

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    networks:
      - backend-net
    deploy:
      replicas: 1

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay
    internal: true

volumes:
  pgdata: