events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        
        resolver 127.0.0.11 valid=5s;

        location /api/tickets/ {
            set $ticket_backend "http://ticket-service:8000";
            proxy_pass $ticket_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/schedule/ {
            set $schedule_backend "http://schedule-service:8001";
            proxy_pass $schedule_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}