events {
    worker_connections 1024;
}

http {
    upstream ticket_backend {
        server ticket-service:8000;
    }

    upstream schedule_backend {
        server schedule-service:8001;
    }

    server {
        listen 80;

        location /api/tickets/ {
            proxy_pass http://ticket_backend/api/tickets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/schedule/ {
            proxy_pass http://schedule_backend/api/schedule/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}